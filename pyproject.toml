[project]
name = "sovereign"
version = "0.1.0"
description = "Sovereign AI engine: QLoRA fine-tuning, quantization and vLLM serving of a small open-weight model, measured against a frontier API on PubMedQA — with a promotion gate that refuses regressions."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "httpx>=0.27",          # streaming client for OpenAI-compatible servers (vLLM)
    "datasets>=3.0",        # PubMedQA from the Hugging Face hub (a few MB)
    "huggingface_hub>=0.24", # `sovereign download`: fetch model and data on the target machine
]

[project.optional-dependencies]
# Fine-tuning and the memory model. bitsandbytes 4-bit needs a CUDA GPU.
train = [
    "torch>=2.4",
    "transformers>=5.0",
    "peft>=0.17",
    "accelerate>=1.0",
    "bitsandbytes>=0.48.1; sys_platform == 'linux'",
]
# Serving. Linux + CUDA only; flags are written against vLLM 0.31. Since vLLM 0.28 bitsandbytes
# quantization ships as a plugin.
serve = [
    "vllm>=0.31,<0.32; sys_platform == 'linux'",
    "vllm-bnb-plugin>=0.0.3; sys_platform == 'linux'",
]
# Post-training quantization of the merged model for serving (fp8 / w4a16), `sovereign compress`.
compress = ["llmcompressor>=0.7"]
frontier = ["anthropic>=1.13"]  # the frontier reference; needs ANTHROPIC_API_KEY
dev = [
    "pytest>=8", "mypy>=1.10", "ruff>=0.5",
    "torch>=2.4", "transformers>=5.0", "peft>=0.17", "accelerate>=1.0",  # the CPU smoke run
    "anthropic>=1.13",  # frontier client tests drive the real SDK over mock HTTP
]

[project.scripts]
sovereign = "sovereign.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sovereign"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "datasets", "transformers", "transformers.*", "peft", "torch", "tokenizers", "anthropic",
    "llmcompressor", "llmcompressor.*",
]
ignore_missing_imports = true

# transformers ships type hints but leaves factory functions (from_config, BitsAndBytesConfig, the
# tokenizer backends) and peft's helpers unannotated; calling them is the point of these modules.
[[tool.mypy.overrides]]
module = ["sovereign.quant", "sovereign.train", "sovereign.smoke", "sovereign.compress"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
